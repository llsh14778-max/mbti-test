<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 MBTI 성격 유형 테스트</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="app-container">
    <!-- 1. 시작 화면 -->
    <section id="start-screen" class="screen active">
      <div class="badge">간편 심리 &amp; 성향 진단</div>
      <div class="hero-icon" aria-hidden="true">🧭</div>
      <h1 class="main-title">나의 MBTI<br />성격 유형 테스트</h1>
      <p class="subtitle">
        12가지 일상 속 질문으로 알아보는<br />
        나만의 진짜 성향과 딱 맞는 캐릭터!
      </p>
      <div class="meta-tags">
        <span>⏱️ 약 2분 소요</span>
        <span>📊 12문항</span>
        <span>✨ 16가지 유형</span>
      </div>
      <button id="start-btn" class="primary-btn" type="button">
        테스트 시작하기
      </button>
    </section>

    <!-- 2. 질문 화면 (한 화면에 하나의 질문 + 두 개의 선택지) -->
    <section id="question-screen" class="screen">
      <div class="progress-header">
        <button id="prev-btn" class="nav-back-btn" type="button" aria-label="이전 질문">
          ← 이전
        </button>
        <span id="progress-text" class="progress-text">1 / 12</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>

      <div id="question-card" class="question-card">
        <div id="question-number" class="question-number">Q1.</div>
        <h2 id="question-title" class="question-title">질문이 여기에 표시됩니다.</h2>
      </div>

      <div class="choices-container">
        <button id="choice-a" class="choice-btn" type="button">
          <span class="choice-label">A</span>
          <span id="choice-a-text" class="choice-text">첫 번째 선택지</span>
        </button>
        <button id="choice-b" class="choice-btn" type="button">
          <span class="choice-label">B</span>
          <span id="choice-b-text" class="choice-text">두 번째 선택지</span>
        </button>
      </div>
    </section>

    <!-- 3. 결과 화면 -->
    <section id="result-screen" class="screen">
      <div class="badge">테스트 결과</div>
      <div id="result-emoji" class="result-emoji">🌟</div>
      <p id="result-subtitle" class="result-subtitle">열정적인 중재자</p>
      <h2 id="result-type" class="result-type">INFP</h2>

      <div id="result-tags" class="result-tags"></div>

      <div class="result-description-box">
        <p id="result-description" class="result-description"></p>
      </div>

      <div class="score-bars" id="score-bars">
        <!-- JS에서 4가지 지표 비율 막대 렌더링 -->
      </div>

      <div class="celebrity-section">
        <h3 class="section-heading">🌟 같은 유형의 유명인 &amp; 캐릭터</h3>
        <div id="celebrity-list" class="celebrity-list">
          <!-- JS에서 유형별 인물/캐릭터 카드 렌더링 -->
        </div>
      </div>

      <div class="match-grid">
        <div class="match-card good">
          <span class="match-title">💖 환상의 궁합</span>
          <strong id="best-match" class="match-type">ENFJ</strong>
        </div>
        <div class="match-card caution">
          <span class="match-title">⚡ 배려가 필요한 궁합</span>
          <strong id="worst-match" class="match-type">ESTJ</strong>
        </div>
      </div>

      <div class="result-actions">
        <button id="restart-btn" class="primary-btn" type="button">
          다시 테스트하기
        </button>
        <button id="share-btn" class="secondary-btn" type="button">
          결과 복사하기
        </button>
      </div>
      <p id="toast-message" class="toast-message" aria-live="polite"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
