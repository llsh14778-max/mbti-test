<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <defs>
    <linearGradient id="bg_q5_a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="spot_q5_a" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="320" height="260" fill="url(#bg_q5_a)"/>
  <rect width="320" height="260" fill="url(#spot_q5_a)"/>

  <!-- B급 영화 집중선 연출 -->
  <g stroke="#facc15" stroke-opacity="0.22" stroke-width="2">
    <line x1="0" y1="0" x2="110" y2="90"/>
    <line x1="320" y1="0" x2="210" y2="90"/>
    <line x1="0" y1="260" x2="110" y2="170"/>
    <line x1="320" y1="260" x2="210" y2="170"/>
    <line x1="160" y1="0" x2="160" y2="55"/>
    <line x1="0" y1="130" x2="65" y2="130"/>
    <line x1="320" y1="130" x2="255" y2="130"/>
  </g>

  <!-- 상단 병맛 뱃지 -->
  <rect x="12" y="10" width="148" height="26" rx="6" fill="#000000" stroke="#facc15" stroke-width="2"/>
  <text x="86" y="27" text-anchor="middle" fill="#facc15" font-family="'Pretendard', sans-serif" font-size="12" font-weight="900">강남 불패 신화</text>

  <!-- 캐릭터 상반신 & 얼굴 클로즈업 -->
  <g transform="translate(0, 6)">
    <!-- 어깨/정장 -->
    <path d="M82 210 Q160 175 238 210 L250 240 L70 240 Z" fill="#18181b" stroke="#000" stroke-width="4"/>
    <path d="M145 188 L160 215 L175 188" fill="#ffffff" stroke="#000" stroke-width="3"/>
    <path d="M156 195 L160 222 L164 195 Z" fill="#dc2626"/>

    <!-- 얼굴 윤곽 -->
    <ellipse cx="160" cy="120" rx="58" ry="62" fill="#fde68a" stroke="#111111" stroke-width="4.5"/>
    <!-- 귀 -->
    <circle cx="100" cy="122" r="11" fill="#fcd34d" stroke="#111111" stroke-width="3.5"/>
    <circle cx="220" cy="122" r="11" fill="#fcd34d" stroke="#111111" stroke-width="3.5"/>

    <!-- 헤어스타일 -->
    <path d="M102 104 Q105 52 160 54 Q215 52 218 104 Q195 74 160 80 Q125 74 102 104 Z" fill="#111111"/>

    <!-- 표정 -->
    
        <!-- 사악/신난 눈썹 -->
        <path d="M112 90 L146 104" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M208 90 L174 104" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>
        <!-- 반짝이는 눈 -->
        <circle cx="132" cy="112" r="10" fill="#facc15" stroke="#111" stroke-width="3"/>
        <circle cx="188" cy="112" r="10" fill="#facc15" stroke="#111" stroke-width="3"/>
        <!-- 씨익 웃는 입 -->
        <path d="M128 140 Q160 172 192 140 Z" fill="#fff" stroke="#111" stroke-width="3.5"/>
        <line x1="148" y1="144" x2="148" y2="156" stroke="#111" stroke-width="2.5"/>
        <line x1="160" y1="145" x2="160" y2="158" stroke="#111" stroke-width="2.5"/>
        <line x1="172" y1="144" x2="172" y2="156" stroke="#111" stroke-width="2.5"/>
      
  </g>

  <!-- 소품/상황 캡션 뱃지 -->
  
    <g transform="translate(160, 194)">
      <rect x="-118" y="-16" width="236" height="32" rx="16" fill="#000000" stroke="#facc15" stroke-width="2.5"/>
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="14" font-weight="900">🏢 강남 등기권리증</text>
    </g>
  

  <!-- 하단 블랙코미디 자막 바 -->
  <rect x="0" y="224" width="320" height="36" fill="rgba(0, 0, 0, 0.88)"/>
  <line x1="0" y1="224" x2="320" y2="224" stroke="#facc15" stroke-width="2"/>
  <text x="160" y="246" text-anchor="middle" fill="#fef08a" font-family="'Pretendard', sans-serif" font-size="12.5" font-weight="800">"무인도에서도 등기권리증부터 챙기는 철저함"</text>
</svg>